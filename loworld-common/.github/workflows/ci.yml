name: CI & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Self-Tests & Verifications
        run: |
          node conventions/verify-common.mjs --self-test
          node conventions/verify-app.mjs --self-test
          node conventions/generate-catalog.mjs --check
          node conventions/verify-common.mjs
          node conventions/component-cycles.mjs src
      - name: Typecheck
        run: npx ngc -p tsconfig.json --noEmit

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@loworld'
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

