<lw-stack gap="md">
  <lw-stack gap="xs">
    <lw-text variant="subheading">화면 틀</lw-text>
    <lw-text variant="caption" tone="muted">헤더, 사이드 메뉴, 화면의 밀도, 모바일 하단 바를 고릅니다. 같은 틀을 쓰는 모든 앱에 바로 적용됩니다.</lw-text>
  </lw-stack>
  @for (item of items; track item.key) {
    <lw-stack direction="row" align="center" justify="between" gap="md" [wrap]="true">
      <lw-text variant="label">{{ item.label }}</lw-text>
      <lw-tabs variant="segment" size="sm" [ariaLabel]="item.label" [tabs]="item.tabs" [value]="store.value()[item.key]" (tabChange)="change(item.key, $event)" />
    </lw-stack>
  }
  @if (store.customized()) {
    <lw-stack direction="row" justify="end">
      <lw-button variant="outline" size="sm" (click)="store.reset()">앱의 기본값으로</lw-button>
    </lw-stack>
  }
</lw-stack>
