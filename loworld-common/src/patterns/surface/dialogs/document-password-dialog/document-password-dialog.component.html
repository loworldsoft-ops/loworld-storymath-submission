<lw-modal [isOpen]="true" size="sm" variant="custom" title="암호 설정" (closeClick)="close.emit()">
  <lw-form-field label="비밀번호">
    <lw-input [type]="showPassword() ? 'text' : 'password'" [value]="password()"
           (valueChange)="password.set(''+$event); mismatch.set(false)"
           placeholder="비밀번호를 입력하세요" class="field-input"/>
  </lw-form-field>
  <lw-form-field label="비밀번호 확인" [error]="mismatch() ? '비밀번호가 일치하지 않습니다.' : ''">
    <lw-input [type]="showPassword() ? 'text' : 'password'" [value]="confirmPassword()"
           (valueChange)="confirmPassword.set(''+$event); mismatch.set(false)"
           placeholder="비밀번호를 다시 입력하세요" class="field-input"
           [class.error]="mismatch()"/>
  </lw-form-field>
  <lw-button class="toggle-show" (click)="showPassword.set(!showPassword())">
    {{ showPassword() ? '비밀번호 숨기기' : '비밀번호 표시' }}
  </lw-button>
  @if (mismatch()) {
    <p class="error-text">비밀번호가 일치하지 않습니다.</p>
  }
  @if (currentPassword()) {
    <lw-button class="remove-btn" (click)="save.emit('')">암호 제거</lw-button>
  }
  <div lwModalFooter class="modal-footer">
    <lw-button class="cancel-btn" (click)="close.emit()">취소</lw-button>
    <lw-button class="save-btn" (click)="savePassword()">저장</lw-button>
  </div>
</lw-modal>
