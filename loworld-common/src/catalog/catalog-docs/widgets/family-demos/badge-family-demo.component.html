@for (group of groups; track group.id) {
  <section class="family-demo__group">
    <h4 class="family-demo__title">{{ group.title }}</h4>
    <div class="family-demo__row">
      @for (item of group.items; track item.id) {
        <lw-badge [tone]="item.tone" [variant]="item.variant" [size]="item.size" [pill]="item.pill ?? false" [label]="item.content" [tooltip]="item.useCase" />
      }
    </div>
  </section>
}
